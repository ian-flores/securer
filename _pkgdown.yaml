url: https://ian-flores.github.io/securer/

template:
  bootstrap: 5
  light-switch: false
  bslib:
    bg: "#f4ecdc"
    fg: "#2b1f12"
    primary: "#bf5a36"
    secondary: "#3f5d72"
    success: "#7c8a4e"
    warning: "#d4a03c"
    border-radius: 0
    border-color: "#cdb48a"
    base_font: {google: "Hanken Grotesk"}
    heading_font: {google: {family: "Fraunces", wght: [400, 500, 600]}}
    code_font: {google: "Space Mono"}
    font-size-base: 1.02rem
    line-height-base: 1.65

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]
  components:
    github:
      icon: fa-github
      aria-label: securer on GitHub
      href: https://github.com/ian-flores/securer

reference:
  - title: Core
    desc: Primary API for secure code execution
    contents:
      - SecureSession
      - SecureSessionPool
      - execute_r
      - with_secure_session
      - securer_tool

  - title: Validation & Logging
    desc: Code validation and audit logging
    contents:
      - validate_code
      - format_tool_result

  - title: Integrations
    desc: LLM framework adapters
    contents:
      - as_ellmer_tool
      - securer_as_ellmer_tool

  - title: Sandbox
    desc: OS-level sandboxing backends
    contents:
      - build_sandbox_config
      - build_sandbox_macos
      - build_sandbox_linux
      - build_sandbox_windows
      - build_sandbox_fallback
      - generate_seatbelt_profile
      - generate_bwrap_args

  - title: Resource Limits
    desc: Process resource restrictions
    contents:
      - default_limits
      - validate_limits
      - generate_ulimit_commands
      - build_limits_only_wrapper

  - title: Internals
    desc: Low-level IPC and child runtime
    contents:
      - child_runtime_code
      - ipc_create_server
      - ipc_accept
      - ipc_read_message
      - ipc_write_message
      - validate_tools
      - generate_tool_wrappers
      - generate_type_checks
      - type_check_map

articles:
  - title: Getting Started
    contents:
      - quickstart
  - title: Deep Dive
    contents:
      - sessions-and-tools
      - deployment
      - security-model
  - title: Integration
    contents:
      - ellmer-integration
      - integration-examples
  - title: Help
    contents:
      - troubleshooting

footer:
  structure:
    left: titleblock
    right: built_with
  components:
    titleblock: >-
      <div class="title-block">
      <div><b>Sheet</b>1 of 4</div>
      <div><b>Quadrangle</b>securer</div>
      <div><b>Survey</b>Sandbox</div>
      <div><b>Series</b>secure-r-dev</div>
      </div>
